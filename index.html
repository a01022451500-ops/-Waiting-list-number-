<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>경기지역본부 대기자 명단 현황</title>
    <style>
        :root {
            --primary-color: #1e3a8a;
            --primary-light: #3b82f6;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --border-color: #e2e8f0;
            --badge-sub-bg: #fef3c7;
            --badge-sub-text: #92400e;
            --badge-doc-bg: #dcfce7;
            --badge-doc-text: #166534;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.4;
            padding: 8px; /* 모바일 여백 최적화 */
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
        }

        /* 헤더 레이아웃 (컴팩트화) */
        .header {
            background: var(--card-bg);
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            margin-bottom: 8px;
        }

        .header h1 {
            font-size: 1.15rem;
            color: var(--primary-color);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stats-summary {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-sub);
        }

        .stats-badge {
            background: #eff6ff;
            color: var(--primary-light);
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }

        /* 검색/필터 영역 (모바일 수직 가나다 배치) */
        .controls {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
        }

        .search-input {
            flex: 1;
            padding: 8px 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
            background-color: var(--card-bg);
            min-width: 0; /* flex 자식 모바일 넘침 방지 */
        }

        .filter-select {
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
            background-color: var(--card-bg);
            width: 95px;
        }

        .search-input:focus, .filter-select:focus {
            border-color: var(--primary-light);
        }

        /* 테이블 레이아웃 (모바일 폭 최적화) */
        .table-container {
            background: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.8rem;
            white-space: normal; /* 모바일에서 텍스트 자동 줄바꿈 적용 */
            word-break: keep-all;
        }

        th {
            background-color: #f8fafc;
            color: var(--text-main);
            font-weight: 600;
            padding: 8px 4px;
            border-bottom: 1.5px solid var(--border-color);
            text-align: center;
            font-size: 0.78rem;
        }

        td {
            padding: 8px 4px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }

        tr:hover {
            background-color: #f8fafc;
        }

        /* 뱃지 및 디자인 요소 모바일 가독성 증대 */
        .badge {
            display: inline-block;
            padding: 2px 4px;
            border-radius: 4px;
            font-size: 0.72rem;
            font-weight: 600;
            text-align: center;
            white-space: nowrap;
        }

        .badge-branch {
            background-color: #e0f2fe;
            color: #0369a1;
        }

        .badge-sub {
            background-color: var(--badge-sub-bg);
            color: var(--badge-sub-text);
        }

        .badge-doc {
            background-color: var(--badge-doc-bg);
            color: var(--badge-doc-text);
        }

        .badge-days {
            background-color: #334155;
            color: #ffffff;
            font-weight: 600;
        }

        .badge-future {
            background-color: #fee2e2;
            color: #dc2626;
        }

        .note-cell {
            white-space: pre-line;
            color: var(--text-sub);
            font-size: 0.75rem;
            line-height: 1.3;
            max-width: 130px;
        }

        /* 스마트폰 가로 폭 줄이기 전용 스타일 */
        @media (max-width: 600px) {
            body {
                padding: 4px;
            }
            th, td {
                padding: 6px 2px;
            }
            .note-cell {
                max-width: 100px;
            }
        }
    </style>
</head>

</div>

// 대기경과일 계산 (모바일 공간 확보를 위해 단축 형태 제공)
function calculatePassedDays(endDateStr) {
    if (!endDateStr) return { text: "-", isFuture: false };

    const today = new Date();
    today.setHours(0, 0, 0, 0);

    const endDate = new Date(endDateStr);
    endDate.setHours(0, 0, 0, 0);

    const diffTime = today - endDate;
    const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

    if (diffDays > 0) {
        return { text: `${diffDays}일`, isFuture: false };
    } else if (diffDays === 0) {
        return { text: "오늘", isFuture: false };
    } else {
        return { text: `-${Math.abs(diffDays)}일`, isFuture: true };
    }
}

// 오늘 날짜 표시
const todayObj = new Date();
document.getElementById('today-date').innerText = `${todayObj.getFullYear()}.${String(todayObj.getMonth() + 1).padStart(2, '0')}.${String(todayObj.getDate()).padStart(2, '0')}`;

// 테이블 렌더링
function renderTable(data) {
    const tableBody = document.getElementById('tableBody');
    document.getElementById('total-count').innerText = `${data.length}명`;
    
    if (data.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="9" style="text-align:center; padding: 20px; color: var(--text-sub);">검색 결과가 없습니다.</td></tr>`;
        return;
    }

    tableBody.innerHTML = data.map(item => {
        const daysInfo = calculatePassedDays(item.endDate);
        const daysBadgeClass = daysInfo.isFuture ? 'badge-future' : 'badge-days';

        return `
            <tr>
                <td style="text-align: center; color: var(--text-sub);">${item.seq}</td>
                <td style="font-weight: 600;">${item.name}</td>
                <td style="text-align: center;"><span class="badge badge-branch">${item.branch}</span></td>
                <td style="font-size: 0.75rem; text-align: center;">${item.endDate}</td>
                <td class="note-cell">${item.note || '-'}</td>
                <td style="font-size: 0.75rem;">${item.company || '-'}</td>
                <td style="text-align: center;">
                    ${item.isSub === 'O' ? '<span class="badge badge-sub">O</span>' : (item.isSub === 'X' ? '<span style="color:#cbd5e1;">X</span>' : '-')}
                </td>
                <td style="text-align: center;">
                    ${item.isDoc === 'O' ? '<span class="badge badge-doc">O</span>' : '-'}
                </td>
                <td style="text-align: center;">
                    <span class="badge ${daysBadgeClass}">${daysInfo.text}</span>
                </td>
            </tr>
        `;
    }).join('');
}

// 검색 및 필터링 기능
function filterData() {
    const searchText = document.getElementById('searchInput').value.toLowerCase().trim();
    const selectedBranch = document.getElementById('branchFilter').value;

    const filtered = waitingList.filter(item => {
        const daysInfo = calculatePassedDays(item.endDate);
        const matchesSearch = 
            item.name.toLowerCase().includes(searchText) ||
            item.branch.toLowerCase().includes(searchText) ||
            item.note.toLowerCase().includes(searchText) ||
            item.company.toLowerCase().includes(searchText) ||
            daysInfo.text.toLowerCase().includes(searchText);

        const matchesBranch = selectedBranch === '' || item.branch === selectedBranch;

        return matchesSearch && matchesBranch;
    });

    renderTable(filtered);
}

document.getElementById('searchInput').addEventListener('input', filterData);
document.getElementById('branchFilter').addEventListener('change', filterData);

renderTable(waitingList);
